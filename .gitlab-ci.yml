variables:
  DEBIAN_FRONTEND: noninteractive
  APT_GET_INSTALL: "apt-get install --no-install-recommends -q -y"

stages:
  - pre
  - build

.display_env:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: on_success
  before_script:
    - date
    - uname -a
    - cat /etc/os-release

pre-commit:
  stage: pre
  image:
    name: alpine:latest
  extends: .display_env
  script:
    - apk add --no-cache git npm pre-commit
    - pre-commit --version
    - pre-commit run --all-files --show-diff-on-failure
    - pre-commit autoupdate --jobs 0
    - git diff .pre-commit-config.yaml

build_pages:
  stage: build
  variables:
    DEBIAN_FRONTEND: noninteractive
    JEKYLL_ENV: production
    APT_GET_INSTALL: "apt-get install --no-install-recommends -q -y"
  image:
    # https://hub.docker.com/_/ruby
    name: ruby:latest
    entrypoint: [""]
  script:
    - date
    - set -x
    - apt-get update
    - "$APT_GET_INSTALL" nodejs
    - (cd "site" && gem install bundler)
    - (cd "site" && bundler install)
    - (cd "site" && jekyll build)
    - ruby -v
    - gem -v
    - jekyll -v
    - mv "site/_site" public
    - find public/
  artifacts:
    paths:
      - public/
