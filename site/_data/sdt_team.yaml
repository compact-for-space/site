# Single source of truth for the "Science Definition Team" table on the
# COMPACT home page (site/index.md).
#
# The table is rendered by Jekyll from this file, and the same data is also
# published as a machine-readable JSON file (sdt_team.json) for readers,
# search engines and downstream tools.
#
# Each entry:
#   name:        Display name (e.g. "Christina Knapek")
#   affiliation: Institution / affiliation (e.g. "University of Greifswald")
#   orcid:       ORCID iD (digits + X). Omit the line if a member has none.
#   ror:         ROR organization ID (e.g. "00r1edq15"). Omit if none.
#
# To add a member: copy one block below. Order in the file is the display
# order on the site (currently alphabetical by surname).
# ============================================================================
