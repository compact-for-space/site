# SCIENCE CORE TEAM AND SCIENCE DEFINITION TEAM (SDT) DATA
# ============================================================================
#
# Single source of truth for the Science core team and the
# "Science Definition Team" table on the # COMPACT home
# page (site/index.md).
#
# The table is rendered by Jekyll from this file, and the same data is also
# published as a machine-readable JSON file (science_team.json) for readers,
# search engines and downstream tools.
#
# Each entry:
#   name:        Display name (e.g. "Christina Knapek")
#   affiliation: Institution / affiliation (e.g. "University of Greifswald")
#   orcid:       ORCID iD (digits + X). Omit the line if a member has none.
#   ror:         ROR organization ID (e.g. "00r1edq15"). Omit if none.
#   role:        Membership/role in the Science Definition Team.
#                Values: "SDT" (member) or "SDT chair". Omit for core-team
#                members who are not part of the SDT.
#                Published in science_team.json as a schema.org "memberOf"
#                reference to the SDT (with "Chair" as roleName).
#
# To add a member: copy one block below. Order in the file is the display
# order on the site (currently alphabetical by surname).
# ============================================================================
